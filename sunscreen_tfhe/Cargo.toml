[package]
name = "sunscreen_tfhe"
version = "0.9.0"
edition = "2024"
authors = ["Sunscreen"]
rust-version = "1.87.0"
license = "AGPL-3.0-only"
description = "This crate contains the Sunscreen Torus FHE (TFHE) implementation"
homepage = "https://sunscreen.tech"
repository = "https://github.com/Sunscreen-tech/spf"
documentation = "https://docs.sunscreen.tech"
keywords = ["FHE", "TFHE", "lattice", "cryptography"]
categories = ["cryptography"]

[dependencies]
aligned-vec = { workspace = true }
bytemuck = { workspace = true }
num = { workspace = true }
num-complex = { workspace = true, features = ["bytemuck"] }
paste = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
raw-cpuid = { workspace = true }
rayon = { workspace = true }
realfft = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
sunscreen_gpu_runtime = { workspace = true, optional = true }
sunscreen_math = { workspace = true }
thiserror = { workspace = true }


[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
rug = { workspace = true }

[build-dependencies]
find_cuda_helper = { workspace = true, optional = true }
rug = { workspace = true, optional = true }

[features]
default = [] #["cuda", "test_kernels"]
cuda = ["gpu", "sunscreen_gpu_runtime/cuda", "dep:find_cuda_helper", "test_kernels"]
gpu = ["dep:sunscreen_gpu_runtime"]
test_kernels = ["gpu", "dep:rug"]

[[bench]]
name = "fft"
harness = false

[[bench]]
name = "ops"
harness = false

[[bench]]
name = "gpu"
harness = false