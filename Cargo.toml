[workspace]
resolver = "2"
members = [
    "benchmark_system_info",
    "examples/basic_add",
    "parasol_concurrency",
    "parasol_cpu",
    "parasol_cpu_macros",
    "parasol_runtime",
    "sunscreen_math",
    "sunscreen_math_macros",
    "sunscreen_tfhe",
    "sunscreen_gpu_runtime"
]
default-members = [
    "benchmark_system_info",
    "examples/basic_add",
    "parasol_concurrency",
    "parasol_cpu",
    "parasol_cpu_macros",
    "parasol_runtime",
    "sunscreen_math",
    "sunscreen_math_macros",
    "sunscreen_tfhe",
]


[workspace.dependencies]
aligned-vec = { version = ">=0.6.2", features = ["serde"] }
approx = "0.5"
bincode = "1"
biodivine-lib-bdd = "0.5"
bumpalo = "3"
bytemuck = "1"
cached = "0.55"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", default-features = false }
crypto-bigint = { version = "0.5", features = ["serde"] }
cuda-driver-sys = "0.3"
cuda-runtime-sys = "0.3.0-alpha.1"
darling = "0.20"
elf = "0.7"
env_logger = "0.11"
find_cuda_helper = "0.2"
indicatif = "0.17"
itertools = "0.14"
log = "0.4"
num = { version = "0.4", features = ["serde"] }
num-complex = { version = "0.4", features = ["bytemuck"] }
num_cpus = "1"
paste = "1"
petgraph = { version = "0.7", features = ["serde-1"] }
proc-macro2 = "1.0"
proptest = "1.1"
quote = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
raw-cpuid = "11"
rayon = "1"
realfft = "3"
reqwest = { version = "0.12", features = ["blocking"] }
rug = "1"
rustfft = "6"
seq-macro = "0.3"
serde = { version = "1", features = ["rc", "derive"] }
serde_json = "1"
statrs = "0.18"
subtle = "2"
syn = { version = "2", features = ["full"] }
sysinfo = "0.35.1"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

# Crates in this repo
benchmark_system_info = { version = "0.9", path = "./benchmark_system_info" }
mux_circuits = { version = "0.9", path = "./mux_circuits" }
parasol_concurrency = { version = "0.9", path = "./parasol_concurrency" }
parasol_cpu = { version = "0.9", path = "./parasol_cpu" }
parasol_cpu_macros = { version = "0.9", path = "./parasol_cpu_macros" }
parasol_runtime = { version = "0.9", path = "./parasol_runtime" }
sunscreen_compiler_macros = { version = "0.9", path = "./sunscreen_compiler_macros" }
sunscreen_gpu_runtime = { version = "0.9", path = "./sunscreen_gpu_runtime" }
sunscreen_math = { version = "0.9", path = "./sunscreen_math" }
sunscreen_math_macros = { version = "0.9", path = "./sunscreen_math_macros" }
sunscreen_tfhe = { version = "0.9", path = "./sunscreen_tfhe" }

[profile.bench]
lto = "fat"
codegen-units = 1

[profile.release]
lto = "fat"
codegen-units = 1
debug = true

[profile.dev.package.sunscreen_tfhe]
opt-level = 3
